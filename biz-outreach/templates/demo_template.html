<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{business_name}</title>
<style>
  :root {{ color-scheme: light; }}
  * {{ box-sizing: border-box; margin: 0; padding: 0; }}
  body {{
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    color: #1a1a1a;
    background: #fafafa;
  }}
  header {{
    background: #1f2937;
    color: #fff;
    padding: 64px 24px;
    text-align: center;
  }}
  header h1 {{ font-size: 2.25rem; margin-bottom: 8px; }}
  header p {{ font-size: 1.1rem; opacity: 0.85; }}
  main {{
    max-width: 720px;
    margin: 0 auto;
    padding: 48px 24px;
  }}
  section {{ margin-bottom: 32px; }}
  h2 {{ font-size: 1.4rem; margin-bottom: 12px; }}
  .contact {{
    display: flex;
    gap: 24px;
    flex-wrap: wrap;
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 12px;
    padding: 24px;
  }}
  .contact div {{ flex: 1; min-width: 160px; }}
  .contact strong {{ display: block; font-size: 0.85rem; color: #6b7280; margin-bottom: 4px; }}
  footer {{
    text-align: center;
    padding: 32px 24px;
    color: #9ca3af;
    font-size: 0.85rem;
  }}
</style>
</head>
<body>
  <header>
    <h1>{business_name}</h1>
    <p>{category}</p>
  </header>
  <main>
    <section>
      <h2>Welcome</h2>
      <p>This is a quick demo of what a simple website for {business_name} could look like.</p>
    </section>
    <section>
      <h2>Contact</h2>
      <div class="contact">
        <div><strong>Address</strong>{address}</div>
        <div><strong>Phone</strong>{phone}</div>
      </div>
    </section>
  </main>
  <footer>Demo page - not affiliated with or endorsed by {business_name}.</footer>
</body>
</html>
